name: Garmin Sync

on:
  schedule:
    - cron: "30 23 * * *" # ~07:30 Asia/Taipei
    - cron: "0 13 * * *"  # ~21:00 Asia/Taipei
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/sync_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Commit changes
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/workouts.json
          git diff --cached --quiet || git commit -m "Sync Garmin activities"
          git push
