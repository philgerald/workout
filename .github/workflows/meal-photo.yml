name: Meal Photo AI Estimate

on:
  push:
    paths:
      - "meals/inbox/**"
  workflow_dispatch: {}

jobs:
  estimate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/estimate_meal.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "meal-photo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meals.json meals/photos meals/inbox
          git diff --cached --quiet || git commit -m "Add AI-estimated meal entries"
          git push
